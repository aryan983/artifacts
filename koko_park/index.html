<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayham St Parking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #222;
      padding-bottom: 16px;
      margin-bottom: 12px;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .sign-p {
      width: 46px; height: 46px;
      border: 3px solid #f0f0f0;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900;
      flex-shrink: 0;
    }

    h1 { font-size: 20px; font-weight: 900; letter-spacing: 4px; line-height: 1; }
    .subtitle { font-size: 10px; color: #555; letter-spacing: 2px; margin-top: 3px; }

    #refresh-btn {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 8px 14px;
      font-size: 18px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s;
    }
    #refresh-btn:hover { color: #f0f0f0; }
    #refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .legend {
      display: flex; gap: 20px;
      font-size: 11px; color: #555;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    #error-box {
      display: none;
      background: #1a0000;
      border: 1px solid #5a0000;
      color: #ff6b6b;
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      padding: 14px 12px;
      min-height: 110px;
      position: relative;
      transition: border-color 0.2s;
    }
    .card.today { border-color: #444; }
    .card.event { background: #1a0606; border-color: #5a1010; }
    .card.clear { background: #06120a; border-color: #0e3018; }
    .card.loading { opacity: 0.4; }

    .today-badge {
      position: absolute; top: 6px; right: 6px;
      font-size: 9px; background: #f0f0f0; color: #000;
      padding: 1px 5px; font-weight: 700; letter-spacing: 1px;
    }

    .day-name { font-size: 10px; color: #555; letter-spacing: 2px; margin-bottom: 2px; }
    .date-num { font-size: 28px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .month { font-size: 11px; color: #444; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .status-nopark { font-size: 11px; color: #ef4444; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    .status-free { font-size: 12px; color: #22c55e; font-weight: 700; letter-spacing: 2px; }
    .evt-name { font-size: 9px; color: #ff8888; letter-spacing: 0.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    footer {
      margin-top: 28px;
      font-size: 10px; color: #333;
      letter-spacing: 1px; text-align: center;
    }
    footer a { color: #444; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="sign-p">P</div>
      <div>
        <h1>BAYHAM ST</h1>
        <div class="subtitle">PARKING FORECAST · KOKO CAMDEN</div>
      </div>
    </div>
    <button id="refresh-btn" title="Refresh">↻</button>
  </header>

  <div class="legend">
    <span class="legend-item"><span class="dot" style="background:#22c55e"></span> FREE</span>
    <span class="legend-item"><span class="dot" style="background:#ef4444"></span> EVENT — NO PARK</span>
  </div>

  <div id="error-box"></div>
  <div id="grid"></div>

  <footer id="footer"></footer>

  <script>
    const API_KEY = "c99bdfc8af29d0fbc49330ce7cb0d136";
    const KOKO_LAT = 51.534722;
    const KOKO_LNG = -0.138333;
    const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function toYMD(d) {
      return d.toISOString().split("T")[0];
    }

    function getNext14Days() {
      const today = new Date();
      today.setHours(0,0,0,0);
      return Array.from({length: 14}, (_, i) => {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        return d;
      });
    }

    const days = getNext14Days();
    const todayYMD = toYMD(days[0]);

    // Render skeleton immediately
    renderGrid(null);

    async function fetchEvents() {
      const btn = document.getElementById("refresh-btn");
      const errBox = document.getElementById("error-box");
      btn.disabled = true;
      errBox.style.display = "none";

      const minDate = toYMD(days[0]);
      const maxDate = toYMD(days[13]);

      // Try direct first, fall back to CORS proxy
      const directUrl = `https://www.skiddle.com/api/v1/events/search/?api_key=${API_KEY}&latitude=${KOKO_LAT}&longitude=${KOKO_LNG}&radius=0.1&minDate=${minDate}&maxDate=${maxDate}&limit=100`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(directUrl)}`;

      let data;
      try {
        const res = await fetch(directUrl);
        if (!res.ok) throw new Error("direct failed");
        data = await res.json();
        if (data.error) throw new Error(data.error);
      } catch (e1) {
        try {
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
          if (data.error) throw new Error(data.error);
        } catch (e2) {
          errBox.textContent = "⚠ Could not reach Skiddle. Check your connection or try again.";
          errBox.style.display = "block";
          btn.disabled = false;
          return;
        }
      }

      // Build date→events map
      const map = {};
      (data.results || []).forEach(ev => {
        const d = ev.date ? ev.date.split(" ")[0] : null;
        if (!d) return;
        if (!map[d]) map[d] = [];
        map[d].push(ev.eventname || "Event");
      });

      renderGrid(map);

      const now = new Date();
      document.getElementById("footer").innerHTML =
        `Updated ${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · Skiddle · <a href="https://koko.co.uk" target="_blank" rel="noreferrer">koko.co.uk</a>`;

      btn.disabled = false;
    }

    function renderGrid(eventsMap) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      days.forEach(date => {
        const ymd = toYMD(date);
        const isToday = ymd === todayYMD;
        const names = eventsMap ? (eventsMap[ymd] || null) : null;
        const hasEvent = eventsMap ? (ymd in eventsMap) : null;

        const card = document.createElement("div");
        card.className = "card" +
          (isToday ? " today" : "") +
          (hasEvent === true ? " event" : "") +
          (hasEvent === false ? " clear" : "") +
          (eventsMap === null ? " loading" : "");

        let inner = "";
        if (isToday) inner += `<div class="today-badge">TODAY</div>`;
        inner += `<div class="day-name">${DAYS[date.getDay()]}</div>`;
        inner += `<div class="date-num">${date.getDate()}</div>`;
        inner += `<div class="month">${MONTHS[date.getMonth()]}</div>`;

        if (eventsMap === null) {
          inner += `<div class="dot" style="background:#333;margin-top:8px"></div>`;
        } else if (hasEvent) {
          inner += `<div class="status-nopark">🚫 NO PARK</div>`;
          (names || []).slice(0, 2).forEach(n => {
            inner += `<div class="evt-name">${n}</div>`;
          });
          if ((names || []).length > 2) {
            inner += `<div class="evt-name">+${names.length - 2} more</div>`;
          }
        } else {
          inner += `<div class="status-free">✓ FREE</div>`;
        }

        card.innerHTML = inner;
        grid.appendChild(card);
      });
    }

    document.getElementById("refresh-btn").addEventListener("click", fetchEvents);
    fetchEvents();
  </script>
</body>
</html>
