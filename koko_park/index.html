<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayham St Parking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh; padding: 24px 16px 48px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #222; padding-bottom: 16px; margin-bottom: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .sign-p {
      width: 46px; height: 46px; border: 3px solid #f0f0f0; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; flex-shrink: 0;
    }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: 4px; line-height: 1; }
    .subtitle { font-size: 10px; color: #555; letter-spacing: 2px; margin-top: 3px; }
    #refresh-btn {
      background: transparent; border: 1px solid #333; color: #888;
      padding: 8px 14px; font-size: 18px; cursor: pointer; font-family: inherit;
    }
    #refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .legend {
      display: flex; gap: 20px; font-size: 11px; color: #555;
      letter-spacing: 1px; margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    #error-box {
      display: none; background: #1a0000; border: 1px solid #5a0000;
      color: #ff6b6b; padding: 10px 14px; font-size: 12px;
      letter-spacing: 1px; margin-bottom: 16px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .card {
      background: #111; border: 1px solid #1e1e1e;
      padding: 14px 12px 12px; position: relative;
      cursor: pointer; transition: transform 0.1s, border-color 0.15s;
      user-select: none;
    }
    .card:hover { transform: translateY(-2px); }
    .card:active { transform: translateY(0); }
    .card.today { border-color: #444; }
    .card.event { background: #120404; border-color: #5a1010; }
    .card.clear { background: #04100a; border-color: #0c2e14; }
    .card.loading { opacity: 0.4; cursor: default; }
    .today-badge {
      position: absolute; top: 6px; right: 6px;
      font-size: 9px; background: #f0f0f0; color: #000;
      padding: 1px 5px; font-weight: 700; letter-spacing: 1px;
    }
    .day-name { font-size: 10px; color: #555; letter-spacing: 2px; margin-bottom: 2px; }
    .date-num { font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .month { font-size: 11px; color: #444; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
    .illustration { width: 100%; display: block; margin-bottom: 10px; border-radius: 3px; }
    .status-nopark { font-size: 11px; color: #ef4444; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    .status-free { font-size: 12px; color: #22c55e; font-weight: 700; letter-spacing: 2px; }
    .evt-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 2px; }
    .evt-name { font-size: 9px; color: #ff8888; letter-spacing: 0.3px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .evt-time { font-size: 9px; color: #ff6060; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    footer { margin-top: 28px; font-size: 10px; color: #333; letter-spacing: 1px; text-align: center; }
    footer a { color: #444; }

    /* ── Modal ─────────────────────────────────────────── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100; align-items: center; justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    #overlay.open { display: flex; }

    #modal {
      width: 100%; max-width: 360px; max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      /* Embossed card */
      background: linear-gradient(160deg, #1c1c1c 0%, #141414 60%, #111 100%);
      border: 1px solid #2e2e2e;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 30px 80px rgba(0,0,0,0.9),
        0 8px 24px rgba(0,0,0,0.6);
      animation: popIn 0.18s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }
    #modal.event-modal {
      background: linear-gradient(160deg, #1c0808 0%, #120404 60%, #0e0303 100%);
      border-color: #3a1010;
      box-shadow:
        0 0 0 1px rgba(255,100,100,0.06) inset,
        0 1px 0 rgba(255,100,100,0.1) inset,
        0 30px 80px rgba(0,0,0,0.9),
        0 8px 24px rgba(80,0,0,0.4);
    }
    #modal.clear-modal {
      background: linear-gradient(160deg, #081408 0%, #040f04 60%, #030e04 100%);
      border-color: #0e3010;
      box-shadow:
        0 0 0 1px rgba(100,255,100,0.04) inset,
        0 1px 0 rgba(100,255,100,0.08) inset,
        0 30px 80px rgba(0,0,0,0.9),
        0 8px 24px rgba(0,40,0,0.3);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: rgba(255,255,255,0.06); border: 1px solid #333;
      color: #888; width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; font-size: 14px; display: flex;
      align-items: center; justify-content: center;
      font-family: inherit; z-index: 1;
    }
    .modal-close:hover { color: #f0f0f0; background: rgba(255,255,255,0.12); }

    .modal-illus {
      width: 100%; display: block;
      border-radius: 10px 10px 0 0;
      overflow: hidden;
    }
    .modal-illus svg { width: 100%; display: block; }

    .modal-body { padding: 20px; }

    .modal-date-row {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px;
    }
    .modal-day { font-size: 11px; color: #666; letter-spacing: 3px; }
    .modal-datenum { font-size: 42px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .modal-month { font-size: 13px; color: #555; letter-spacing: 2px; align-self: flex-end; padding-bottom: 4px; }

    .modal-status-free {
      font-size: 16px; color: #22c55e; font-weight: 700;
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .modal-status-event {
      font-size: 13px; color: #ef4444; font-weight: 700;
      letter-spacing: 2px; margin-bottom: 14px;
    }

    .modal-divider { border: none; border-top: 1px solid #222; margin: 14px 0; }
    .modal-divider.red { border-color: #3a1010; }
    .modal-divider.green { border-color: #0e3010; }

    .modal-event-list { display: flex; flex-direction: column; gap: 10px; }

    .modal-event-item {
      display: flex; flex-direction: column; gap: 3px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #2a1010;
      border-radius: 6px;
    }
    .modal-event-name {
      font-size: 12px; color: #ffaaaa; font-weight: 700;
      letter-spacing: 0.5px; line-height: 1.3;
    }
    .modal-event-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .modal-event-time { font-size: 11px; color: #ff6060; letter-spacing: 1px; }
    .modal-event-link {
      font-size: 10px; color: #888; text-decoration: none;
      letter-spacing: 1px; border: 1px solid #3a1010;
      padding: 2px 8px; border-radius: 3px;
      transition: color 0.15s, border-color 0.15s;
    }
    .modal-event-link:hover { color: #ffaaaa; border-color: #8a2020; }

    .modal-free-note {
      font-size: 11px; color: #2d7a3a; letter-spacing: 1px; line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="sign-p">P</div>
      <div>
        <h1>BAYHAM ST</h1>
        <div class="subtitle">PARKING FORECAST · KOKO CAMDEN</div>
      </div>
    </div>
    <button id="refresh-btn" title="Refresh">↻</button>
  </header>

  <div class="legend">
    <span class="legend-item"><span class="dot" style="background:#22c55e"></span> FREE</span>
    <span class="legend-item"><span class="dot" style="background:#ef4444"></span> EVENT — NO PARK</span>
  </div>

  <div id="error-box"></div>
  <div id="grid"></div>
  <footer id="footer"></footer>

  <!-- Modal -->
  <div id="overlay">
    <div id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-illus" id="modal-illus"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const API_KEY = "c99bdfc8af29d0fbc49330ce7cb0d136";
    const KOKO_LAT = 51.534722;
    const KOKO_LNG = -0.138333;
    const DAYS_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const DAYS_SHORT = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function toYMD(d) { return d.toISOString().split("T")[0]; }

    function getNext14Days() {
      const today = new Date(); today.setHours(0,0,0,0);
      return Array.from({length:14}, (_,i) => {
        const d = new Date(today); d.setDate(today.getDate()+i); return d;
      });
    }

    function formatTime(dateStr) {
      if (!dateStr || !dateStr.includes(" ")) return "";
      const t = dateStr.split(" ")[1];
      const [hh,mm] = t.split(":");
      const h = parseInt(hh);
      return `${h%12||12}:${mm}${h>=12?"PM":"AM"}`;
    }

    // ── SVG illustrations ────────────────────────────────────────────────────
    const CAR_PALETTES = [
      ["#c0392b","#e74c3c","#922b21"],
      ["#d35400","#e67e22","#a04000"],
      ["#7d3c98","#9b59b6","#6c3483"],
      ["#1a5276","#2980b9","#154360"],
      ["#196f3d","#27ae60","#1e8449"],
      ["#9a7d0a","#f1c40f","#b7950b"],
    ];

    function svgFree(large) {
      const h = large ? 130 : 68;
      const vb = `0 0 320 ${large ? 130 : 68}`;
      const rh = large ? 72 : 38; // road height
      const bh = large ? 55 : 25; // bay height
      const by = rh + 3;
      const fs = large ? 18 : 11;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">
        <rect width="320" height="${h}" fill="#0d1a0f"/>
        <rect x="0" y="0" width="320" height="${rh}" fill="#161616"/>
        <rect x="0" y="${rh}" width="320" height="3" fill="#2a2a2a"/>
        <line x1="0" y1="${rh/2}" x2="320" y2="${rh/2}" stroke="#2e2e2e" stroke-width="2" stroke-dasharray="18,10"/>
        <line x1="107" y1="${rh+3}" x2="107" y2="${h}" stroke="#1a3d22" stroke-width="1"/>
        <line x1="214" y1="${rh+3}" x2="214" y2="${h}" stroke="#1a3d22" stroke-width="1"/>
        <rect x="3" y="${by+2}" width="101" height="${bh}" rx="1" fill="none" stroke="#1a5c2a" stroke-width="1.5" stroke-dasharray="5,4"/>
        <rect x="110" y="${by+2}" width="101" height="${bh}" rx="1" fill="none" stroke="#1a5c2a" stroke-width="1.5" stroke-dasharray="5,4"/>
        <rect x="217" y="${by+2}" width="100" height="${bh}" rx="1" fill="none" stroke="#1a5c2a" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="53"  y="${by + bh*0.65}" fill="#1a5c2a" font-size="${fs}" font-family="monospace" font-weight="bold" text-anchor="middle">P</text>
        <text x="160" y="${by + bh*0.65}" fill="#1a5c2a" font-size="${fs}" font-family="monospace" font-weight="bold" text-anchor="middle">P</text>
        <text x="267" y="${by + bh*0.65}" fill="#1a5c2a" font-size="${fs}" font-family="monospace" font-weight="bold" text-anchor="middle">P</text>
      </svg>`;
    }

    function svgEvent(seed, large) {
      const h = large ? 130 : 68;
      const vb = `0 0 320 ${large ? 130 : 68}`;
      const rh = large ? 72 : 38;
      const by = rh + 3;
      const bh = large ? 52 : 22;
      const cw = large ? 95 : 46;
      const ch = large ? 42 : 18;
      const ww = large ? 28 : 14; // window width
      const wh = large ? 14 : 7;  // window height
      const pal = CAR_PALETTES[seed % CAR_PALETTES.length];
      const [c1,c2,c3] = pal;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">
        <rect width="320" height="${h}" fill="#140606"/>
        <rect x="0" y="0" width="320" height="${rh}" fill="#161616"/>
        <rect x="0" y="${rh}" width="320" height="3" fill="#2a2a2a"/>
        <line x1="0" y1="${rh/2}" x2="320" y2="${rh/2}" stroke="#2e2e2e" stroke-width="2" stroke-dasharray="18,10"/>
        <line x1="107" y1="${rh+3}" x2="107" y2="${h}" stroke="#5a1010" stroke-width="1"/>
        <line x1="214" y1="${rh+3}" x2="214" y2="${h}" stroke="#5a1010" stroke-width="1"/>
        <rect x="0"   y="${rh+3}" width="107" height="${h}" fill="#1a0505"/>
        <rect x="107" y="${rh+3}" width="107" height="${h}" fill="#1a0505"/>
        <rect x="214" y="${rh+3}" width="106" height="${h}" fill="#1a0505"/>

        <!-- Car 1 -->
        <rect x="6"   y="${by+4}" width="${cw}" height="${ch}" rx="${large?5:3}" fill="${c1}"/>
        <rect x="${6+8}" y="${by+8}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.25)"/>
        <rect x="${6+8+ww+5}" y="${by+8}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.18)"/>
        <rect x="6"   y="${by+ch-2}" width="${large?14:7}" height="${large?8:5}" rx="1" fill="#222"/>
        <rect x="${6+cw-large?14:7}" y="${by+ch-2}" width="${large?14:7}" height="${large?8:5}" rx="1" fill="#222"/>

        <!-- Car 2 (slightly skewed) -->
        <g transform="rotate(-1.8, 160, ${by+ch/2})">
          <rect x="113" y="${by+3}" width="${cw}" height="${ch}" rx="${large?5:3}" fill="${c2}"/>
          <rect x="${113+8}" y="${by+7}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.25)"/>
          <rect x="${113+8+ww+5}" y="${by+7}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.18)"/>
        </g>
        <rect x="113" y="${by+ch+1}" width="${large?14:7}" height="${large?6:4}" rx="1" fill="#222"/>
        <rect x="${113+cw-8}" y="${by+ch+1}" width="${large?14:7}" height="${large?6:4}" rx="1" fill="#222"/>

        <!-- Car 3 -->
        <rect x="220" y="${by+4}" width="${cw}" height="${ch}" rx="${large?5:3}" fill="${c3}"/>
        <rect x="${220+8}" y="${by+8}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.25)"/>
        <rect x="${220+8+ww+5}" y="${by+8}" width="${ww}" height="${wh}" rx="1" fill="rgba(255,255,255,0.18)"/>
        <rect x="220" y="${by+ch-2}" width="${large?14:7}" height="${large?8:5}" rx="1" fill="#222"/>
        <rect x="${220+cw-8}" y="${by+ch-2}" width="${large?14:7}" height="${large?8:5}" rx="1" fill="#222"/>
      </svg>`;
    }

    // ─────────────────────────────────────────────────────────────────────────

    const days = getNext14Days();
    const todayYMD = toYMD(days[0]);
    let eventsMap = null;

    renderGrid(null);

    async function fetchEvents() {
      const btn = document.getElementById("refresh-btn");
      const errBox = document.getElementById("error-box");
      btn.disabled = true; errBox.style.display = "none";

      const minDate = toYMD(days[0]);
      const maxDate = toYMD(days[13]);
      const directUrl = `https://www.skiddle.com/api/v1/events/search/?api_key=${API_KEY}&latitude=${KOKO_LAT}&longitude=${KOKO_LNG}&radius=0.1&minDate=${minDate}&maxDate=${maxDate}&limit=100`;
      const proxyUrl  = `https://corsproxy.io/?${encodeURIComponent(directUrl)}`;

      let data;
      try {
        const res = await fetch(directUrl);
        if (!res.ok) throw new Error();
        data = await res.json();
        if (data.error) throw new Error(data.error);
      } catch {
        try {
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
          if (data.error) throw new Error(data.error);
        } catch (e) {
          errBox.textContent = "⚠ Could not reach Skiddle. Try again.";
          errBox.style.display = "block";
          btn.disabled = false; return;
        }
      }

      eventsMap = {};
      (data.results || []).forEach(ev => {
        const d = ev.date ? ev.date.split(" ")[0] : null;
        if (!d) return;
        if (!eventsMap[d]) eventsMap[d] = [];
        eventsMap[d].push({
          name: ev.eventname || "Event",
          time: formatTime(ev.date),
          link: ev.link || null
        });
      });

      renderGrid(eventsMap);
      const now = new Date();
      document.getElementById("footer").innerHTML =
        `Updated ${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · Skiddle · <a href="https://koko.co.uk" target="_blank">koko.co.uk</a>`;
      btn.disabled = false;
    }

    function renderGrid(map) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      days.forEach((date, idx) => {
        const ymd    = toYMD(date);
        const isToday = ymd === todayYMD;
        const evts   = map ? (map[ymd] || null) : null;
        const hasEvent = map ? (ymd in map) : null;
        const seed   = date.getDate() + date.getMonth() * 31 + idx;

        const card = document.createElement("div");
        card.className = "card"
          + (isToday ? " today" : "")
          + (hasEvent === true  ? " event" : "")
          + (hasEvent === false ? " clear" : "")
          + (map === null ? " loading" : "");

        if (map !== null) {
          card.addEventListener("click", () => openModal(date, ymd, evts, hasEvent, seed));
        }

        let inner = "";
        if (isToday) inner += `<div class="today-badge">TODAY</div>`;
        inner += `<div class="day-name">${DAYS_SHORT[date.getDay()]}</div>`;
        inner += `<div class="date-num">${date.getDate()}</div>`;
        inner += `<div class="month">${MONTHS[date.getMonth()]}</div>`;

        if (map === null) {
          inner += `<div style="height:68px;background:#0e0e0e;margin-bottom:10px;border-radius:3px"></div>`;
          inner += `<div class="status-free" style="color:#2a2a2a">· · ·</div>`;
        } else if (hasEvent) {
          inner += svgEvent(seed, false);
          inner += `<div class="status-nopark">🚫 NO PARK</div>`;
          (evts||[]).slice(0,2).forEach(ev => {
            inner += `<div class="evt-row">
              <span class="evt-name">${ev.name}</span>
              ${ev.time ? `<span class="evt-time">${ev.time}</span>` : ""}
            </div>`;
          });
          if ((evts||[]).length > 2) inner += `<div class="evt-name" style="color:#aa5555">+${evts.length-2} more</div>`;
        } else {
          inner += svgFree(false);
          inner += `<div class="status-free">✓ FREE</div>`;
        }

        card.innerHTML = inner;
        grid.appendChild(card);
      });
    }

    // ── Modal ────────────────────────────────────────────────────────────────
    function openModal(date, ymd, evts, hasEvent, seed) {
      const overlay = document.getElementById("overlay");
      const modal   = document.getElementById("modal");
      const illusEl = document.getElementById("modal-illus");
      const bodyEl  = document.getElementById("modal-body");

      modal.className = hasEvent ? "event-modal" : "clear-modal";

      illusEl.innerHTML = hasEvent ? svgEvent(seed, true) : svgFree(true);

      const isToday  = ymd === todayYMD;
      const dayFull  = DAYS_FULL[date.getDay()];
      const dateNum  = date.getDate();
      const monthStr = MONTHS[date.getMonth()];
      const divClass = hasEvent ? "red" : "green";

      let body = `
        <div class="modal-date-row">
          <div>
            <div class="modal-day">${dayFull.toUpperCase()}${isToday ? " · TODAY" : ""}</div>
            <div style="display:flex;align-items:baseline;gap:8px">
              <div class="modal-datenum">${dateNum}</div>
              <div class="modal-month">${monthStr.toUpperCase()}</div>
            </div>
          </div>
        </div>
        <hr class="modal-divider ${divClass}">`;

      if (hasEvent) {
        body += `<div class="modal-status-event">🚫 EXPECT NO PARKING</div>`;
        body += `<div class="modal-event-list">`;
        (evts||[]).forEach(ev => {
          body += `<div class="modal-event-item">
            <div class="modal-event-name">${ev.name}</div>
            <div class="modal-event-meta">
              ${ev.time ? `<span class="modal-event-time">⏱ ${ev.time}</span>` : `<span></span>`}
              ${ev.link ? `<a class="modal-event-link" href="${ev.link}" target="_blank" rel="noreferrer">SKIDDLE ↗</a>` : ""}
            </div>
          </div>`;
        });
        body += `</div>`;
      } else {
        body += `<div class="modal-status-free">✓ PARKING FREE</div>`;
        body += `<p class="modal-free-note">No events listed at KOKO on this date. Bayham St should be clear.</p>`;
      }

      bodyEl.innerHTML = body;
      overlay.classList.add("open");
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("overlay")) closeModal();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    function closeModal() {
      document.getElementById("overlay").classList.remove("open");
    }

    document.getElementById("refresh-btn").addEventListener("click", fetchEvents);
    fetchEvents();
  </script>
</body>
</html>
