<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayham St Parking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh; padding: 24px 16px 48px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #222; padding-bottom: 16px; margin-bottom: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .sign-p {
      width: 46px; height: 46px; border: 3px solid #f0f0f0; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; flex-shrink: 0;
    }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: 4px; line-height: 1; }
    .subtitle { font-size: 10px; color: #555; letter-spacing: 2px; margin-top: 3px; }
    #refresh-btn {
      background: transparent; border: 1px solid #333; color: #888;
      padding: 8px 14px; font-size: 18px; cursor: pointer; font-family: inherit;
    }
    #refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .legend {
      display: flex; gap: 20px; font-size: 11px; color: #555;
      letter-spacing: 1px; margin-bottom: 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    #error-box {
      display: none; background: #1a0000; border: 1px solid #5a0000;
      color: #ff6b6b; padding: 10px 14px; font-size: 12px;
      letter-spacing: 1px; margin-bottom: 16px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .card {
      background: #111; border: 1px solid #1e1e1e;
      padding: 14px 12px 12px; position: relative;
      cursor: pointer; transition: transform 0.1s;
      user-select: none;
    }
    .card:hover { transform: translateY(-2px); }
    .card:active { transform: translateY(0); }
    .card.today { border-color: #444; }
    .card.event { background: #120404; border-color: #5a1010; }
    .card.clear { background: #04100a; border-color: #0c2e14; }
    .card.loading { opacity: 0.4; cursor: default; }
    .today-badge {
      position: absolute; top: 6px; right: 6px;
      font-size: 9px; background: #f0f0f0; color: #000;
      padding: 1px 5px; font-weight: 700; letter-spacing: 1px;
    }
    .day-name { font-size: 10px; color: #555; letter-spacing: 2px; margin-bottom: 2px; }
    .date-num { font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .month { font-size: 11px; color: #444; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
    .status-nopark { font-size: 11px; color: #ef4444; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; }
    .status-free { font-size: 12px; color: #22c55e; font-weight: 700; letter-spacing: 2px; }
    .evt-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 2px; }
    .evt-name { font-size: 9px; color: #ff8888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .evt-time { font-size: 9px; color: #ff6060; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    footer { margin-top: 28px; font-size: 10px; color: #333; letter-spacing: 1px; text-align: center; }
    footer a { color: #444; }

    /* ── Modal ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(6px);
    }
    #overlay.open { display: flex; }

    #modal {
      width: 100%; max-width: 460px;
      max-height: 92vh; overflow-y: auto;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
      border: 1px solid #2a2a2a;
      border-bottom: none;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 -20px 80px rgba(0,0,0,0.8);
      animation: slideUp 0.22s cubic-bezier(0.34,1.4,0.64,1);
    }
    #modal.event-modal {
      background: linear-gradient(180deg, #1c0808 0%, #0e0303 100%);
      border-color: #3a1010;
    }
    #modal.clear-modal {
      background: linear-gradient(180deg, #081408 0%, #030e04 100%);
      border-color: #0e3010;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    .modal-drag-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: #333; margin: 10px auto 0;
    }

    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.07); border: 1px solid #333;
      color: #666; width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; font-size: 13px; display: flex;
      align-items: center; justify-content: center; font-family: inherit; z-index: 1;
    }
    .modal-close:hover { color: #f0f0f0; }

    /* Map annotation area */
    .map-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      margin: 14px 16px 0;
      width: calc(100% - 32px);
    }
    .map-container img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
    .map-container svg.overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .map-label {
      position: absolute;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .modal-body { padding: 16px 16px 24px; }
    .modal-date-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .modal-datenum { font-size: 44px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
    .modal-day { font-size: 10px; color: #666; letter-spacing: 3px; }
    .modal-month { font-size: 13px; color: #555; letter-spacing: 2px; }
    .modal-status-free { font-size: 14px; color: #22c55e; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; }
    .modal-status-event { font-size: 13px; color: #ef4444; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
    .modal-divider { border: none; border-top: 1px solid #222; margin: 12px 0; }
    .modal-divider.red { border-color: #3a1010; }
    .modal-divider.green { border-color: #0e3010; }
    .modal-event-list { display: flex; flex-direction: column; gap: 8px; }
    .modal-event-item {
      padding: 10px 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #2a1010;
      border-radius: 6px;
    }
    .modal-event-name { font-size: 12px; color: #ffaaaa; font-weight: 700; margin-bottom: 5px; }
    .modal-event-meta { display: flex; align-items: center; justify-content: space-between; }
    .modal-event-time { font-size: 11px; color: #ff6060; letter-spacing: 1px; }
    .modal-event-link {
      font-size: 10px; color: #888; text-decoration: none;
      letter-spacing: 1px; border: 1px solid #3a1010;
      padding: 2px 8px; border-radius: 3px;
    }
    .modal-event-link:hover { color: #ffaaaa; }
    .modal-free-note { font-size: 11px; color: #2d7a3a; letter-spacing: 1px; line-height: 1.6; }

    /* Spot counter badge */
    .spot-counter {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .spot-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      padding: 3px 10px; border-radius: 4px;
    }
    .spot-badge.full { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #5a1010; }
    .spot-badge.free { background: rgba(34,197,94,0.12); color: #22c55e; border: 1px solid #0e3010; }
  </style>
</head>

      const t = new Date(); t.setHours(0,0,0,0);

    function formatTime(s) {
      if (!s || !s.includes(" ")) return "";
      const [,t] = s.split(" "); const [hh,mm] = t.split(":");

      return `${h%12||12}:${mm}${h>=12?"PM":"AM"}`;

        const t0 = i/N, t1 = (i+1)/N;
        const p = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
        const p1 = p(TL,BL,t0), p2 = p(TR,BR,t0);
        const p3 = p(TR,BR,t1), p4 = p(TL,BL,t1);
        // Add small inset for visual gap between spots
        const inset = 2;
        const insetPts = (pts) => {
          // simple shrink toward centroid
          const cx = pts.reduce((s,p)=>s+p[0],0)/4;
          const cy = pts.reduce((s,p)=>s+p[1],0)/4;
          return pts.map(p => [p[0]+(cx-p[0])*inset/100, p[1]+(cy-p[1])*inset/100]);
        };
        const pts = insetPts([p1,p2,p3,p4]);
        spots.push(pts.map(p=>p.join(",")).join(" "));
      }
      return spots;
    }

    const SPOTS = getSpots();

    function renderMapOverlay(hasEvent) {
      const svg = document.getElementById("map-svg");
      const fill   = hasEvent ? "rgba(239,68,68,0.55)"  : "rgba(34,197,94,0.45)";
      const stroke = hasEvent ? "#ef4444" : "#22c55e";
      svg.innerHTML = SPOTS.map((pts, i) => `
        <polygon points="${pts}"
          fill="${fill}" stroke="${stroke}" stroke-width="1.5" rx="2"
          style="filter: drop-shadow(0 0 4px ${stroke})"/>
      `).join("") + `
        <text x="388" y="490" fill="${stroke}" font-size="9" font-family="monospace"
          font-weight="bold" text-anchor="middle" opacity="0.9"
          style="text-shadow:0 1px 2px #000">
          ${hasEvent ? "FULL" : "FREE"}
        </text>`;
    }

    // ─────────────────────────────────────────────────────────────────────────

    const days = getNext14Days();
    const todayYMD = toYMD(days[0]);
    let eventsMap = null;

    renderGrid(null);

    async function fetchEvents() {
      const btn = document.getElementById("refresh-btn");
      const errBox = document.getElementById("error-box");
      btn.disabled = true; errBox.style.display = "none";
      const minDate = toYMD(days[0]), maxDate = toYMD(days[13]);
      const direct = `https://www.skiddle.com/api/v1/events/search/?api_key=${API_KEY}&latitude=${KOKO_LAT}&longitude=${KOKO_LNG}&radius=0.1&minDate=${minDate}&maxDate=${maxDate}&limit=100`;
      const proxy  = `https://corsproxy.io/?${encodeURIComponent(direct)}`;
      let data;
      try {
        const r = await fetch(direct);
        if (!r.ok) throw 0;
        data = await r.json();
        if (data.error) throw data.error;
      } catch {
        try {
          const r = await fetch(proxy);
          if (!r.ok) throw `HTTP ${r.status}`;
          data = await r.json();
          if (data.error) throw data.error;
        } catch(e) {
          errBox.textContent = "⚠ Could not reach Skiddle. Try again.";
          errBox.style.display = "block";
          btn.disabled = false; return;
        }
      }
      eventsMap = {};
      (data.results||[]).forEach(ev => {
        const d = ev.date?.split(" ")[0];
        if (!d) return;
        if (!eventsMap[d]) eventsMap[d] = [];
        eventsMap[d].push({ name: ev.eventname||"Event", time: formatTime(ev.date), link: ev.link||null });
      });
      renderGrid(eventsMap);
      const now = new Date();
      document.getElementById("footer").innerHTML =
        `Updated ${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · Skiddle · <a href="https://koko.co.uk" target="_blank">koko.co.uk</a>`;
      btn.disabled = false;
    }

    function renderGrid(map) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      days.forEach((date, idx) => {
        const ymd = toYMD(date);
        const isToday = ymd === todayYMD;
        const evts = map ? (map[ymd]||null) : null;
        const hasEvent = map ? (ymd in map) : null;

        const card = document.createElement("div");
        card.className = "card"
          + (isToday?" today":"")
          + (hasEvent===true?" event":"")
          + (hasEvent===false?" clear":"")
          + (map===null?" loading":"");

        if (map !== null) card.addEventListener("click", () => openModal(date, ymd, evts, hasEvent));

        let h = "";
        if (isToday) h += `<div class="today-badge">TODAY</div>`;
        h += `<div class="day-name">${DAYS_SHORT[date.getDay()]}</div>`;
        h += `<div class="date-num">${date.getDate()}</div>`;
        h += `<div class="month">${MONTHS[date.getMonth()]}</div>`;

        if (map === null) {
          h += `<div class="status-free" style="color:#2a2a2a;margin-top:8px">· · ·</div>`;
        } else if (hasEvent) {
          h += `<div class="status-nopark">🚫 NO PARK</div>`;
          (evts||[]).slice(0,2).forEach(ev => {
            h += `<div class="evt-row">
              <span class="evt-name">${ev.name}</span>
              ${ev.time ? `<span class="evt-time">${ev.time}</span>` : ""}
            </div>`;
          });
          if ((evts||[]).length > 2) h += `<div class="evt-name" style="color:#aa5555">+${evts.length-2} more</div>`;
        } else {
          h += `<div class="status-free">✓ FREE</div>`;
        }

        card.innerHTML = h;
        grid.appendChild(card);
      });
    }

    function openModal(date, ymd, evts, hasEvent) {
      const overlay = document.getElementById("overlay");
      const modal   = document.getElementById("modal");
      const bodyEl  = document.getElementById("modal-body");

      modal.className = hasEvent ? "event-modal" : "clear-modal";
      renderMapOverlay(hasEvent);

      const isToday = ymd === todayYMD;
      const totalSpots = 6;

      let body = `
        <div class="modal-date-row">
          <div class="modal-datenum">${date.getDate()}</div>
          <div>
            <div class="modal-day">${DAYS_FULL[date.getDay()].toUpperCase()}${isToday?" · TODAY":""}</div>
            <div class="modal-month">${MONTHS[date.getMonth()].toUpperCase()}</div>
          </div>
        </div>
        <div class="spot-counter">
          <span class="spot-badge ${hasEvent?"full":"free"}">
            ${hasEvent ? `${totalSpots}/${totalSpots} SPOTS TAKEN` : `${totalSpots}/${totalSpots} SPOTS FREE`}
          </span>
        </div>
        <hr class="modal-divider ${hasEvent?"red":"green"}">`;

      if (hasEvent) {
        body += `<div class="modal-status-event">🚫 EXPECT NO PARKING</div>`;
        body += `<div class="modal-event-list">`;
        (evts||[]).forEach(ev => {
          body += `<div class="modal-event-item">
            <div class="modal-event-name">${ev.name}</div>
            <div class="modal-event-meta">
              ${ev.time ? `<span class="modal-event-time">⏱ ${ev.time}</span>` : "<span></span>"}
              ${ev.link ? `<a class="modal-event-link" href="${ev.link}" target="_blank">SKIDDLE ↗</a>` : ""}
            </div>
          </div>`;
        });
        body += `</div>`;
      } else {
        body += `<div class="modal-status-free">✓ ALL CLEAR</div>`;
        body += `<p class="modal-free-note">No events at KOKO. Bayham St should be clear.</p>`;
      }

      bodyEl.innerHTML = body;
      overlay.classList.add("open");
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("overlay")) closeModal();
    });
    document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); });
    function closeModal() { document.getElementById("overlay").classList.remove("open"); }

    document.getElementById("refresh-btn").addEventListener("click", fetchEvents);
    fetchEvents();
  </script>
</body>
</html>
